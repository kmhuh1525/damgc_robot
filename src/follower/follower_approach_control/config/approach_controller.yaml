/follower/approach_controller:
  ros__parameters:
    base_frame: base_link
    target_tag_id: 0
    enabled_on_startup: false
    publish_rate: 20.0
    # ROS 2 Humble usb_cam converts the V4L monotonic stamp with a process-start
    # fractional-second offset.  Live runs measured a fixed 0.31-0.79 s age;
    # 1.20 s covers the theoretical <1 s offset plus perception latency.
    # Selector/guard receipt watchdogs remain independently at 0.35/0.30 s.
    pose_timeout: 1.20
    # Deprecated no-op: atomic messages no longer require callback sync.
    sample_sync_tolerance: 0.10
    # Kept for existing launch/config compatibility. Perception owns the
    # 0.242 m base-frame final target and publishes the active control error atomically.
    target_forward: 0.242
    # Gains and raw limits remain conservative topic-validation values.
    linear_gain: 0.20
    angular_gain: 0.80
    lateral_gain: 0.50
    max_raw_linear_speed: 0.04
    max_raw_angular_speed: 0.15
    near_max_angular_speed: 0.10
    max_final_linear_speed: 0.02
    max_final_angular_speed: 0.06
    blind_final_speed: 0.015
    # Deprecated no-op retained for compatibility; reverse remains prohibited.
    allow_reverse: false
