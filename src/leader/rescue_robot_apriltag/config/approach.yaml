# Initial Leader camera-frame state-estimation values for integration testing.
# target_distance and the tolerances are not confirmed gripper/TCP geometry.
# tag_timeout=1.0 is a conservative trial value. A 10 s Leader measurement saw
# about 29.98 Hz tag TF, 0.166787 s maximum sample gap, and 0.067281 s maximum
# timestamp age. Re-measure under sustained load before treating it as final.
/leader/apriltag_approach:
  ros__parameters:
    source_frame: camera_color_optical_frame
    base_frame: base_link
    tf_lookup_timeout: 0.0
    tag_frame_pattern: "leader/tag36h11:{id}"
    target_tag_id: 0
    allowed_tag_ids: [0, 1, 2]
    selection_mode: priority

    target_distance: 0.15
    distance_tolerance: 0.02
    lateral_tolerance: 0.02
    angle_tolerance_deg: 5.0

    tag_timeout: 1.0
    stable_time: 0.8
    publish_rate: 20.0
    filter_window: 5

    # Tag-normal target-pose alignment. Distances are from the tag plane to the
    # desired base_link origin and remain initial values pending grasp tuning.
    pre_align_distance: 0.30
    final_target_distance: 0.23
    orientation_engage_distance: 0.40
    orientation_disengage_distance: 0.43
    turn_enter_error_deg: 8.0
    turn_exit_error_deg: 3.0
    tag_recenter_enter_deg: 18.0
    tag_recenter_exit_deg: 11.0
    near_normal_correction_limit_deg: 6.0
    pre_align_position_tolerance: 0.02
    final_position_tolerance: 0.020
    final_yaw_tolerance_deg: 5.0
    final_realign_yaw_error_deg: 8.0
    base_stable_time: 0.30
    aligned_confirm_samples: 3
    stabilizing_tag_loss_grace_sec: 0.20
    final_approach_tag_loss_grace_sec: 0.20

    # Restricted fallback for a tag that leaves the camera only after visual
    # final alignment. Distances are base_link forward metres.
    blind_final_approach_enabled: true
    blind_activation_max_tag_x: 0.30
    blind_max_distance: 0.12
    blind_last_tag_max_age: 0.25
    blind_handoff_max_age: 0.40
    blind_max_duration: 5.0
    odom_topic: /leader/odom/raw

    # Mandatory final advance after visual alignment (or successful tag-loss
    # blind fallback). The standalone node defaults to disabled.
    post_align_odom_enabled: false
    post_align_grasp_target_distance: 0.16
    post_align_max_distance: 0.12
    post_align_max_duration: 8.0
    post_align_odom_timeout: 0.25
