/leader/velocity_guard:
  ros__parameters:
    guard_enabled_on_startup: false
    publish_rate: 50.0
    command_timeout: 0.30

    # Conservative software-validation limits, not final motor tuning.
    max_linear_speed: 0.05
    max_angular_speed: 0.20
    max_linear_acceleration: 0.10
    max_angular_acceleration: 0.40
    max_slew_dt: 0.10
    axis_epsilon: 1.0e-9
    allow_reverse: false
    shutdown_stop_count: 3

    command_topic: /leader/approach/cmd_vel_raw
    safe_command_topic: /leader/approach/cmd_vel_safe
