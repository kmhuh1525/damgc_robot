cooperative_path_preview:
  ros__parameters:
    # Planar object-to-robot model. +x points from each axle toward the box.
    # The axle-to-hinge and hinge-to-contact values reproduce the measured
    # 25.75 cm axle-to-contact distance in the neutral pose.
    geometry_ready: true
    axle_to_hinge: 0.125
    hinge_to_contact: 0.1325
    object_center_to_contact: 0.0525
    hinge_limit_deg: 15.0
    # Reserve 20% of the measured passive hinge travel for tracking error.
    curvature_margin: 0.8
    lateral_tolerance: 0.005
    object_path_topic: /cooperation/object_path
    leader_path_topic: /cooperation/leader_path_preview
    follower_path_topic: /cooperation/follower_path_preview
    status_topic: /cooperation/path_preview/status

cooperative_object_path_planner:
  ros__parameters:
    start_topic: /cooperation/object_start
    goal_topic: /cooperation/object_goal
    object_path_topic: /cooperation/object_path
    status_topic: /cooperation/object_path_planner/status
    axle_to_hinge: 0.125
    hinge_to_contact: 0.1325
    object_center_to_contact: 0.0525
    hinge_limit_deg: 15.0
    curvature_margin: 0.8
    lateral_tolerance: 0.005
    sample_step: 0.05
    # Demo floor plan: 3 m x 4 m, with an obstacle inside the 90-degree turn.
    obstacle_circles: [-0.8, 0.0, 0.18]
    workspace_bounds: [-1.5, 1.5, -2.0, 2.0]
    robot_radius: 0.32
    safety_margin: 0.05

cooperative_leader_path_adapter:
  ros__parameters:
    leader_path_topic: /plan
    object_path_topic: /cooperation/object_path
    status_topic: /cooperation/leader_path_adapter/status
    axle_to_hinge: 0.125
    hinge_to_contact: 0.1325
    object_center_to_contact: 0.0525
    hinge_limit_deg: 15.0
    curvature_margin: 0.8
    lateral_tolerance: 0.005

cooperative_path_tracking_preview:
  ros__parameters:
    path_topic: /cooperation/follower_path_preview
    odom_topic: /follower/odom/raw
    command_preview_topic: /cooperation/follower/path_tracking/cmd_vel_preview
    status_topic: /cooperation/follower/path_tracking/status
    publish_rate: 20.0
    lookahead_distance: 0.20
    max_path_error: 0.40
    goal_tolerance: 0.05
    max_linear_speed: 0.05
    max_angular_speed: 0.20
    lateral_acceleration: 0.08
    odom_timeout: 0.50
